<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Follow the clues inside a muscle cell. A hands-on, nine-stage investigation of Duchenne muscular dystrophy for young scientists.">
  <meta name="theme-color" content="#294124">
  <title>Muscle Mystery — An investigation inside the cell</title>

<body>
  <a class="skip-link" href="#stage">Skip to the activity</a>
